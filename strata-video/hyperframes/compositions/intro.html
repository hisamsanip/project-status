<html>
  <body>
    <style>
      /* Title card: warm clay palette to match the claymation scenes. Bottom 200px kept clear for Remotion subtitles. */
      :root {
        --ground: #fff4e6;
        --ground-2: #ffe1bf;
        --ink: #2b2118;
        --muted: #7a5c43;
        --accent: #e8743b;
        --teal: #2f9c95;
        --font: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      #intro-root {
        position: relative; width: 100%; height: 100%; font-family: var(--font); color: var(--ink); overflow: hidden;
        background: radial-gradient(1200px 700px at 50% 40%, var(--ground-2), transparent 70%), var(--ground);
      }
      .clip { position: absolute; inset: 0; }
      .blob { position: absolute; border-radius: 50%; filter: blur(2px); opacity: .55; }
      #b1 { width: 420px; height: 420px; left: -120px; top: -100px; background: #ffc796; }
      #b2 { width: 360px; height: 360px; right: -90px; bottom: 120px; background: #9fd8cf; }
      #building { position: absolute; left: 50%; top: 110px; margin-left: -110px; width: 220px; height: 240px; }
      #badge {
        position: absolute; left: 0; right: 0; top: 380px; text-align: center;
      }
      #badge span {
        display: inline-block; padding: 12px 30px; border-radius: 999px; background: var(--teal); color: #fff;
        font-size: 34px; font-weight: 700; letter-spacing: .04em;
      }
      #title {
        position: absolute; left: 0; right: 0; top: 470px; text-align: center;
        font-size: 120px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.02;
      }
      #title em { font-style: normal; color: var(--accent); }
      #subtitle {
        position: absolute; left: 0; right: 0; top: 730px; text-align: center;
        font-size: 46px; font-weight: 500; color: var(--muted);
      }
    </style>
    <div id="intro-root" data-composition-id="intro" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div id="scene" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div id="b1" class="blob"></div>
        <div id="b2" class="blob"></div>
        <svg id="building" viewBox="0 0 220 240">
          <rect x="30" y="40" width="160" height="190" rx="18" fill="#f6c89f" stroke="#2b2118" stroke-width="6" />
          <rect x="70" y="10" width="80" height="40" rx="10" fill="#e8743b" stroke="#2b2118" stroke-width="6" />
          <g fill="#2f9c95" stroke="#2b2118" stroke-width="4">
            <rect class="win" x="55" y="70" width="34" height="30" rx="6" /><rect class="win" x="131" y="70" width="34" height="30" rx="6" />
            <rect class="win" x="55" y="118" width="34" height="30" rx="6" /><rect class="win" x="131" y="118" width="34" height="30" rx="6" />
          </g>
          <rect x="88" y="170" width="44" height="60" rx="8" fill="#7a5c43" stroke="#2b2118" stroke-width="5" />
        </svg>
        <div id="badge"><span>AKTA 757</span></div>
        <h1 id="title">Akta Pengurusan<br /><em>Strata 2013</em></h1>
        <p id="subtitle">Panduan ringkas untuk pemilik &amp; penghuni</p>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".blob", { scale: 0 }, { scale: 1, duration: 1.2, ease: "power3.out", stagger: 0.15 }, 0)
        .fromTo("#building", { opacity: 0, y: 60, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "back.out(1.8)" }, 0.15)
        .fromTo(".win", { fill: "#2f9c95" }, { fill: "#ffd84d", duration: 0.2, stagger: 0.12 }, 1.0)
        .fromTo("#badge span", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.2)" }, 0.6)
        .fromTo("#title", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.8, ease: "power4.out" }, 0.8)
        .fromTo("#subtitle", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.3)
        .to("#building", { y: -12, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.0)
        .to("#scene", { opacity: 0, scale: 1.05, filter: "blur(8px)", duration: 0.5, ease: "power2.in" }, 7.5);
      window.__timelines["intro"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
