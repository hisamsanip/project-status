<style>
  :root{
    --navy-950:#0a1628;
    --navy-900:#0e1f38;
    --navy-800:#132a4a;
    --navy-700:#1c3a63;
    --navy-600:#284d80;
    --gold-500:#c9a227;
    --gold-400:#dab945;
    --gold-300:#e8cd6f;
    --ink-100:#f4f6fa;
    --ink-300:#c3ccdb;
    --ink-500:#8393ad;
    --red-500:#e2574c;
    --amber-500:#1faae2;
    --green-500:#3fae6a;
    --blue-400:#5c9be0;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--navy-950);font-family:'Poppins',sans-serif;color:var(--ink-100);}
  #root{min-height:100vh;}
  .app{max-width:1360px;margin:0 auto;padding:28px 32px 64px;}
  .header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;border-bottom:1px solid var(--navy-700);padding-bottom:20px;margin-bottom:24px;}
  .header .eyebrow{color:var(--gold-400);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin:0 0 6px;}
  .header h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.01em;}
  .header .sub{color:var(--ink-500);font-size:13.5px;margin-top:6px;}
  .cutoff-badge{background:var(--navy-800);border:1px solid var(--navy-600);color:var(--gold-300);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;}

  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
  .kpi-card{background:linear-gradient(155deg,var(--navy-800),var(--navy-900));border:1px solid var(--navy-700);border-radius:14px;padding:20px 22px;position:relative;overflow:hidden;}
  .kpi-card::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:var(--gold-500);}
  .kpi-label{font-size:12px;color:var(--ink-500);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:10px;}
  .kpi-value{font-size:28px;font-weight:700;color:var(--ink-100);line-height:1;}
  .kpi-sub{font-size:12.5px;margin-top:8px;font-weight:500;color:var(--ink-500);}

  .grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px;}
  .panel{background:var(--navy-900);border:1px solid var(--navy-700);border-radius:14px;padding:20px 22px 12px;}
  .panel h3{margin:0 0 2px;font-size:15px;font-weight:600;color:var(--ink-100);}
  .panel .panel-sub{font-size:12px;color:var(--ink-500);margin-bottom:14px;}

  .legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--ink-500);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--navy-700);position:sticky;top:0;background:var(--navy-900);cursor:pointer;user-select:none;}
  td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--ink-300);}
  tr:hover td{background:rgba(255,255,255,.02);}
  .status-pill{padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:.03em;white-space:nowrap;}
  .status-active{background:rgba(31,170,226,.15);color:var(--amber-500);}
  .status-end{background:rgba(63,174,106,.15);color:var(--green-500);}
  .pill-landed{background:rgba(92,155,224,.15);color:var(--blue-400);}
  .pill-highrise{background:rgba(201,162,39,.15);color:var(--gold-300);}
  .pill-mc{background:rgba(63,174,106,.15);color:var(--green-500);}
  .pill-jmb{background:rgba(92,155,224,.15);color:var(--blue-400);}
  .pill-ra{background:rgba(31,170,226,.15);color:var(--amber-500);}
  .pill-pr1ma{background:rgba(226,87,76,.12);color:var(--red-500);}
  .bar-cell{display:flex;align-items:center;gap:8px;}
  .bar-track{flex:1;height:6px;background:var(--navy-700);border-radius:3px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:3px;}
  .table-scroll{max-height:440px;overflow-y:auto;}
  .search-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  input[type=text]{background:var(--navy-800);border:1px solid var(--navy-600);color:var(--ink-100);padding:8px 14px;border-radius:8px;font-family:'Poppins';font-size:13px;flex:1;min-width:200px;}
  input[type=text]::placeholder{color:var(--ink-500);}
  select{background:var(--navy-800);border:1px solid var(--navy-600);color:var(--ink-100);padding:8px 12px;border-radius:8px;font-family:'Poppins';font-size:13px;}
  .footer-note{color:var(--ink-500);font-size:11.5px;margin-top:26px;text-align:center;line-height:1.6;}
  .tooltip-box{background:var(--navy-800);border:1px solid var(--navy-600);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--ink-100);}
  .risk-name{color:var(--ink-100);font-weight:500;}

  .update-panel{background:var(--navy-900);border:1px dashed var(--navy-600);border-radius:14px;padding:18px 22px;margin-bottom:24px;}
  .update-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .update-head h3{margin:0;font-size:14px;}
  .update-head .chev{color:var(--gold-400);font-size:13px;transition:transform .15s;}
  .update-body{margin-top:16px;}
  .drop-zone{border:1.5px dashed var(--navy-600);border-radius:10px;padding:24px;text-align:center;color:var(--ink-500);font-size:13px;cursor:pointer;transition:border-color .15s,background .15s;}
  .drop-zone:hover, .drop-zone.dragover{border-color:var(--gold-500);background:rgba(201,162,39,.05);}
  .drop-zone b{color:var(--gold-300);}
  .update-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;}
  .btn{background:var(--gold-500);color:var(--navy-950);border:none;padding:9px 18px;border-radius:8px;font-family:'Poppins';font-weight:600;font-size:13px;cursor:pointer;}
  .btn:hover{background:var(--gold-400);}
  .btn.secondary{background:transparent;border:1px solid var(--navy-600);color:var(--ink-300);}
  .btn.secondary:hover{border-color:var(--gold-500);color:var(--gold-300);}
  .status-msg{font-size:12.5px;margin-top:10px;padding:8px 12px;border-radius:8px;}
  .status-msg.ok{background:rgba(63,174,106,.12);color:var(--green-500);}
  .status-msg.err{background:rgba(226,87,76,.12);color:var(--red-500);}
  .field-label{font-size:11.5px;color:var(--ink-500);display:block;margin-bottom:5px;}

  @media(max-width:900px){
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .grid-2,.grid-3{grid-template-columns:1fr;}
  }
</style>
</head>

const STORAGE_KEY = "pfmsb_project_dashboard_v1";

const GOLD = "#c9a227";
const GOLD_LIGHT = "#e8cd6f";
const RED = "#e2574c";
const AMBER = "#1faae2";
const GREEN = "#3fae6a";
const BLUE = "#5c9be0";
const NAVY_LINE = "#1c3a63";

function fmt(n){ return (n || 0).toLocaleString(); }
function num(v){ return typeof v === "number" && !isNaN(v) ? v : 0; }
function pct1(n){ return (n || 0).toFixed(1) + "%"; }

// ---------- persistence ----------
function loadStoredProjects() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return null;
    return parsed;
  } catch (e) { return null; }
}
function saveStoredProjects(projects) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(projects)); } catch (e) {}
}

// ---------- Excel parsing: merges "PFMSB Master Project Data" + a monthly sales sheet ----------
function findHeaderRowByLabel(rows, label, withinFirstN) {
  const limit = withinFirstN ? Math.min(rows.length, withinFirstN) : rows.length;
  for (let i = 0; i < limit; i++) {
    if (rows[i] && rows[i].some(c => typeof c === "string" && c.trim() === label)) return i;
  }
  return -1;
}
function findStopRow(rows, startIdx, marker) {
  for (let i = startIdx; i < rows.length; i++) {
    const c0 = rows[i] && rows[i][0];
    if (typeof c0 === "string" && c0.includes(marker)) return i;
  }
  return rows.length;
}

function parseMasterSheet(workbook, sheetName) {
  const ws = workbook.Sheets[sheetName];
  if (!ws) throw new Error("Sheet not found: " + sheetName);
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
  const headerIdx = findHeaderRowByLabel(rows, "Reporting Project Name", 6);
  if (headerIdx === -1) throw new Error('Could not find "Reporting Project Name" header row.');
  const headerRow = rows[headerIdx];
  const colIndex = {};
  headerRow.forEach((h, i) => { if (h != null) colIndex[String(h).trim()] = i; });

  const required = ["Reporting Project Name","Typology","Title","Total Units","State","Management Status","Key Handed Over","Moved In"];
  const missing = required.filter(h => !(h in colIndex));
  if (missing.length) throw new Error("Master sheet missing columns: " + missing.join(", "));

  const dlpKey = Object.keys(colIndex).find(k => k.replace(/\s+/g," ").includes("DLP Status") && k.includes("Owner")) || null;

  const out = {};
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row) continue;
    const name = row[colIndex["Reporting Project Name"]];
    if (!name || typeof name !== "string" || !name.trim()) continue;
    const kho = num(row[colIndex["Key Handed Over"]]);
    const moved = num(row[colIndex["Moved In"]]);
    const totalUnits = num(row[colIndex["Total Units"]]);
    out[name.trim()] = {
      name: name.replace(/^Residensi\s+/, ""),
      typology: row[colIndex["Typology"]] || "",
      title: row[colIndex["Title"]] || "",
      state: row[colIndex["State"]] || "",
      totalUnits,
      developer: row[colIndex["Developer"]] || "",
      deliverablePhase: row[colIndex["Deliverable Phase"]] || "",
      qlassic: typeof row[colIndex["QLASSIC Score"]] === "number" ? row[colIndex["QLASSIC Score"]] : null,
      completionYear: row[colIndex["Completion Year"]] || null,
      dlpStatusOwner: dlpKey ? (row[colIndex[dlpKey]] || "") : "",
      managementStatus: row[colIndex["Management Status"]] || "",
      keyHandedOver: kho,
      movedIn: moved,
      khoPct: totalUnits ? Math.round((kho / totalUnits) * 1000) / 10 : null,
      movedInPct: totalUnits ? Math.round((moved / totalUnits) * 1000) / 10 : null,
      unsold: null,
      salesExecuted: null,
      vpIssued: null,
    };
  }
  return out;
}

function parseSalesSheet(workbook, sheetName) {
  const ws = workbook.Sheets[sheetName];
  if (!ws) throw new Error("Sheet not found: " + sheetName);
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
  const headerIdx = findHeaderRowByLabel(rows, "Project Name");
  if (headerIdx === -1) throw new Error('Could not find "Project Name" header row in the monthly sheet.');
  const headerRow = rows[headerIdx];
  const colIndex = {};
  headerRow.forEach((h, i) => { if (h != null) colIndex[String(h).trim()] = i; });
  if (!("Unsold (Not VP)" in colIndex)) throw new Error('Monthly sheet missing "Unsold (Not VP)" column.');

  const stopIdx = findStopRow(rows, headerIdx + 1, "Project DLP Status");
  const out = {};
  for (let i = headerIdx + 1; i < stopIdx; i++) {
    const row = rows[i];
    if (!row) continue;
    const name = row[colIndex["Project Name"]];
    if (!name || typeof name !== "string" || !name.trim()) continue;
    out[name.trim()] = {
      unsold: row[colIndex["Unsold (Not VP)"]],
      salesExecuted: row[colIndex["Sales Executed"]],
      vpIssued: row[colIndex["VP issued"]],
    };
  }
  return out;
}

function mergeProjects(master, sales) {
  return Object.keys(master).map(key => {
    const m = master[key];
    const s = sales[key];
    return {
      ...m,
      unsold: s && typeof s.unsold === "number" ? s.unsold : m.unsold,
      salesExecuted: s && typeof s.salesExecuted === "number" ? s.salesExecuted : m.salesExecuted,
      vpIssued: s && typeof s.vpIssued === "number" ? s.vpIssued : m.vpIssued,
    };
  });
}

// ---------- UI atoms ----------
function KpiCard({ label, value, sub }) {
  return (
    <div className="kpi-card">
      <div className="kpi-label">{label}</div>
      <div className="kpi-value">{value}</div>
      {sub && <div className="kpi-sub">{sub}</div>}
    </div>
  );
}

function CustomTooltip({active, payload, label}) {
  if (!active || !payload || !payload.length) return null;
  return (
    <div className="tooltip-box">
      {label && <div style={{color:GOLD_LIGHT, fontWeight:600, marginBottom:4}}>{label}</div>}
      {payload.map((p,i) => (
        <div key={i} style={{color:p.color || p.fill}}>{p.name}: <b>{fmt(p.value)}</b></div>
      ))}
    </div>
  );
}

function TypologyChart({ projects }) {
  const landed = projects.filter(p => p.typology === "Landed").reduce((s,p)=>s+num(p.totalUnits),0);
  const highrise = projects.filter(p => p.typology === "High-Rise").reduce((s,p)=>s+num(p.totalUnits),0);
  const data = [
    { name: "Landed", value: landed, color: BLUE },
    { name: "High-Rise", value: highrise, color: GOLD },
  ];
  return (
    <ResponsiveContainer width="100%" height={220}>
      <PieChart>
        <Pie data={data} dataKey="value" nameKey="name" cx="50%" cy="50%" innerRadius={55} outerRadius={80} paddingAngle={3}>
          {data.map((d,i) => <Cell key={i} fill={d.color} stroke="none" />)}
        </Pie>
        <Tooltip content={<CustomTooltip />} />
      </PieChart>
    </ResponsiveContainer>
  );
}

function ManagementChart({ projects }) {
  const counts = {};
  projects.forEach(p => { const k = p.managementStatus || "Unknown"; counts[k] = (counts[k]||0)+1; });
  const colors = { MC: GREEN, JMB: BLUE, RA: AMBER, PR1MA: RED, Unknown: "#5c7ba8" };
  const data = Object.entries(counts).map(([name,value]) => ({ name, value, color: colors[name] || "#5c7ba8" }));
  return (
    <ResponsiveContainer width="100%" height={200}>
      <BarChart data={data} layout="vertical" margin={{left:10,right:20}}>
        <CartesianGrid strokeDasharray="3 3" stroke={NAVY_LINE} horizontal={false} />
        <XAxis type="number" stroke="#8393ad" fontSize={11} tickLine={false} axisLine={false} allowDecimals={false} />
        <YAxis type="category" dataKey="name" stroke="#c3ccdb" fontSize={12} width={70} tickLine={false} axisLine={false} />
        <Tooltip content={<CustomTooltip />} />
        <Bar dataKey="value" radius={[0,4,4,0]} barSize={20} name="Projects">
          {data.map((d,i) => <Cell key={i} fill={d.color} />)}
        </Bar>
      </BarChart>
    </ResponsiveContainer>
  );
}

function StateChart({ projects }) {
  const counts = {};
  projects.forEach(p => { const k = p.state || "Unknown"; counts[k] = (counts[k]||0)+num(p.totalUnits); });
  const data = Object.entries(counts).map(([name,value]) => ({ name, value })).sort((a,b)=>b.value-a.value);
  return (
    <ResponsiveContainer width="100%" height={280}>
      <BarChart data={data} margin={{top:5,right:10,left:-10,bottom:40}}>
        <CartesianGrid strokeDasharray="3 3" stroke={NAVY_LINE} vertical={false} />
        <XAxis dataKey="name" stroke="#8393ad" fontSize={11} angle={-40} textAnchor="end" interval={0} tickLine={false} axisLine={{stroke:NAVY_LINE}} height={70} />
        <YAxis stroke="#8393ad" fontSize={11} tickLine={false} axisLine={false} tickFormatter={v=>fmt(v)} />
        <Tooltip content={<CustomTooltip />} />
        <Bar dataKey="value" fill={GOLD} radius={[4,4,0,0]} barSize={22} name="Units" />
      </BarChart>
    </ResponsiveContainer>
  );
}

function HandoverGauge({ label, pct, count, total, color }) {
  const data = [{ name: label, value: pct, fill: color }];
  return (
    <div style={{textAlign:"center"}}>
      <div style={{position:"relative", width:"100%", height:140}}>
        <ResponsiveContainer width="100%" height={140}>
          <RadialBarChart innerRadius="70%" outerRadius="100%" data={data} startAngle={90} endAngle={-270}>
            <RadialBar dataKey="value" cornerRadius={8} background={{fill:"var(--navy-700)"}} max={100} />
          </RadialBarChart>
        </ResponsiveContainer>
        <div style={{
          position:"absolute", top:0, left:0, right:0, bottom:0,
          display:"flex", alignItems:"center", justifyContent:"center",
          fontSize:19, fontWeight:700, color:"var(--ink-100)", pointerEvents:"none"
        }}>{pct1(pct)}</div>
      </div>
      <div style={{fontSize:12.5, color:"var(--ink-500)", marginTop:4}}>{label}</div>
      <div style={{fontSize:11, color:"var(--ink-500)"}}>{fmt(count)} of {fmt(total)} units</div>
    </div>
  );
}

function UnsoldRiskList({ projects }) {
  const risky = [...projects].filter(p => (p.unsold||0) > 0).sort((a,b)=>(b.unsold||0)-(a.unsold||0)).slice(0,8);
  if (!risky.length) return <div style={{color:"var(--ink-500)", fontSize:13}}>No unsold-unit data available.</div>;
  return (
    <div>
      {risky.map((p,i) => (
        <div key={i} style={{display:"flex", alignItems:"center", gap:10, padding:"9px 0", borderBottom: i<risky.length-1 ? "1px solid rgba(255,255,255,.05)" : "none"}}>
          <div style={{width:20, fontSize:12, color:"var(--ink-500)", fontWeight:600}}>{i+1}</div>
          <div style={{flex:1}}>
            <div className="risk-name" style={{fontSize:13}}>{p.name}</div>
            <div style={{fontSize:11, color:"var(--ink-500)"}}>{p.state} &middot; {p.typology} &middot; {fmt(p.totalUnits)} total units</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{color:AMBER, fontWeight:700, fontSize:14}}>{fmt(p.unsold)}</div>
            <div style={{fontSize:10, color:"var(--ink-500)"}}>unsold</div>
          </div>
        </div>
      ))}
    </div>
  );
}

function ProjectTable({ projects }) {
  const [query, setQuery] = useState("");
  const [typologyFilter, setTypologyFilter] = useState("All");
  const [mgmtFilter, setMgmtFilter] = useState("All");
  const [sortKey, setSortKey] = useState("totalUnits");
  const [sortDir, setSortDir] = useState("desc");

  const filtered = useMemo(() => {
    let rows = [...projects];
    if (query) rows = rows.filter(p => p.name.toLowerCase().includes(query.toLowerCase()) || (p.state||"").toLowerCase().includes(query.toLowerCase()));
    if (typologyFilter !== "All") rows = rows.filter(p => p.typology === typologyFilter);
    if (mgmtFilter !== "All") rows = rows.filter(p => p.managementStatus === mgmtFilter);
    rows.sort((a,b) => {
      const av = a[sortKey] ?? 0, bv = b[sortKey] ?? 0;
      if (typeof av === "string") return sortDir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
      return sortDir === "asc" ? av - bv : bv - av;
    });
    return rows;
  }, [projects, query, typologyFilter, mgmtFilter, sortKey, sortDir]);

  const toggleSort = (key) => {
    if (sortKey === key) setSortDir(d => d === "asc" ? "desc" : "asc");
    else { setSortKey(key); setSortDir("desc"); }
  };
  const arrow = (key) => sortKey === key ? (sortDir === "asc" ? " \u2191" : " \u2193") : "";

  const mgmtOptions = [...new Set(projects.map(p=>p.managementStatus).filter(Boolean))];

  return (
    <div className="panel" style={{gridColumn:"1 / -1"}}>
      <h3>All Projects — Status &amp; Handover</h3>
      <div className="panel-sub">Click column headers to sort. Search by project name or state.</div>
      <div className="search-row">
        <input type="text" placeholder="Search project or state..." value={query} onChange={e=>setQuery(e.target.value)} />
        <select value={typologyFilter} onChange={e=>setTypologyFilter(e.target.value)}>
          <option value="All">All typologies</option>
          <option value="Landed">Landed</option>
          <option value="High-Rise">High-Rise</option>
        </select>
        <select value={mgmtFilter} onChange={e=>setMgmtFilter(e.target.value)}>
          <option value="All">All management</option>
          {mgmtOptions.map(m => <option key={m} value={m}>{m}</option>)}
        </select>
      </div>
      <div className="table-scroll">
        <table>
          <thead>
            <tr>
              <th onClick={()=>toggleSort("name")}>Project{arrow("name")}</th>
              <th onClick={()=>toggleSort("state")}>State{arrow("state")}</th>
              <th onClick={()=>toggleSort("typology")}>Typology{arrow("typology")}</th>
              <th onClick={()=>toggleSort("dlpStatusOwner")}>DLP{arrow("dlpStatusOwner")}</th>
              <th onClick={()=>toggleSort("managementStatus")}>Mgmt{arrow("managementStatus")}</th>
              <th onClick={()=>toggleSort("totalUnits")}>Total Units{arrow("totalUnits")}</th>
              <th onClick={()=>toggleSort("khoPct")}>Handed Over %{arrow("khoPct")}</th>
              <th onClick={()=>toggleSort("unsold")}>Unsold{arrow("unsold")}</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map((p,i) => (
              <tr key={i}>
                <td style={{color:"var(--ink-100)", fontWeight:500}}>{p.name}</td>
                <td>{p.state}</td>
                <td><span className={"status-pill " + (p.typology === "Landed" ? "pill-landed" : "pill-highrise")}>{p.typology || "—"}</span></td>
                <td><span className={"status-pill " + (p.dlpStatusOwner === "ACTIVE" ? "status-active" : "status-end")}>{p.dlpStatusOwner === "ACTIVE" ? "Active" : "Ended"}</span></td>
                <td>
                  <span className={"status-pill " + (p.managementStatus==="MC"?"pill-mc":p.managementStatus==="JMB"?"pill-jmb":p.managementStatus==="RA"?"pill-ra":"pill-pr1ma")}>
                    {p.managementStatus || "—"}
                  </span>
                </td>
                <td>{fmt(p.totalUnits)}</td>
                <td>
                  {p.khoPct != null ? (
                    <div className="bar-cell">
                      <div className="bar-track"><div className="bar-fill" style={{width:Math.min(p.khoPct,100)+"%", background:GREEN}}></div></div>
                      <span style={{width:40, textAlign:"right", fontVariantNumeric:"tabular-nums"}}>{p.khoPct}%</span>
                    </div>
                  ) : "—"}
                </td>
                <td style={{color: (p.unsold||0) > 0 ? AMBER : "var(--ink-300)", fontWeight: (p.unsold||0) > 0 ? 600 : 400}}>
                  {p.unsold != null ? fmt(p.unsold) : "—"}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function UpdatePanel({ onImport, onReset, onExport }) {
  const [open, setOpen] = useState(false);
  const [file, setFile] = useState(null);
  const [workbook, setWorkbook] = useState(null);
  const [masterSheet, setMasterSheet] = useState("");
  const [salesSheet, setSalesSheet] = useState("");
  const [status, setStatus] = useState(null);
  const fileInputRef = useRef(null);

  const handleFile = (f) => {
    if (!f) return;
    setStatus(null);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: "array", cellDates: false });
        setWorkbook(wb);
        setFile(f);
        const mGuess = wb.SheetNames.find(n => /master/i.test(n)) || wb.SheetNames[0];
        const sGuess = wb.SheetNames.find(n => /\d{4}/.test(n) && !/master/i.test(n)) || wb.SheetNames[0];
        setMasterSheet(mGuess);
        setSalesSheet(sGuess);
      } catch (err) {
        setStatus({ type: "err", text: "Could not read file: " + err.message });
      }
    };
    reader.readAsArrayBuffer(f);
  };

  const handleImport = () => {
    if (!workbook || !masterSheet) {
      setStatus({ type: "err", text: "Pick a file and the master project sheet first." });
      return;
    }
    try {
      const master = parseMasterSheet(workbook, masterSheet);
      const sales = salesSheet ? parseSalesSheet(workbook, salesSheet) : {};
      const merged = mergeProjects(master, sales);
      onImport(merged);
      setStatus({ type: "ok", text: `Imported ${merged.length} projects from "${masterSheet}"` + (salesSheet ? ` + sales data from "${salesSheet}".` : " (no sales sheet selected — unsold/handover from master only).") });
      setFile(null); setWorkbook(null);
      if (fileInputRef.current) fileInputRef.current.value = "";
    } catch (err) {
      setStatus({ type: "err", text: err.message });
    }
  };

  return (
    <div className={"update-panel" + (open ? "" : "")}>
      <div className="update-head" onClick={() => setOpen(o => !o)}>
        <h3>&#128260; Update Project Data</h3>
        <span className="chev" style={{transform: open ? "none" : "rotate(-90deg)"}}>&#9660;</span>
      </div>
      {open && (
        <div className="update-body">
          <div className="panel-sub" style={{marginBottom:12}}>
            Import a refreshed workbook to update project details and unsold/handover figures — parsing happens entirely in your browser.
          </div>
          <div
            className="drop-zone"
            onClick={() => fileInputRef.current && fileInputRef.current.click()}
            onDragOver={(e) => { e.preventDefault(); e.currentTarget.classList.add("dragover"); }}
            onDragLeave={(e) => e.currentTarget.classList.remove("dragover")}
            onDrop={(e) => { e.preventDefault(); e.currentTarget.classList.remove("dragover"); handleFile(e.dataTransfer.files[0]); }}
          >
            {file ? <span><b>{file.name}</b> selected — choose the sheets below</span>
                  : <span>Drag a file here, or <b>click to browse</b> (.xlsx, .xlsm)</span>}
            <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.xlsm" style={{display:"none"}}
              onChange={(e) => handleFile(e.target.files[0])} />
          </div>

          {workbook && (
            <div className="update-row">
              <div>
                <label className="field-label">Master project sheet (Typology, Total Units, Handed Over...)</label>
                <select value={masterSheet} onChange={(e) => setMasterSheet(e.target.value)}>
                  {workbook.SheetNames.map(n => <option key={n} value={n}>{n}</option>)}
                </select>
              </div>
              <div>
                <label className="field-label">Sales/monthly sheet for Unsold units (optional)</label>
                <select value={salesSheet} onChange={(e) => setSalesSheet(e.target.value)}>
                  <option value="">— none —</option>
                  {workbook.SheetNames.map(n => <option key={n} value={n}>{n}</option>)}
                </select>
              </div>
              <button className="btn" onClick={handleImport}>Import</button>
            </div>
          )}

          {status && <div className={"status-msg " + status.type}>{status.text}</div>}

          <div className="update-row" style={{marginTop:18, borderTop:"1px solid var(--navy-700)", paddingTop:14}}>
            <button className="btn secondary" onClick={onExport}>Export current dataset (.json)</button>
            <button className="btn secondary" onClick={() => { if (confirm("Reset to the originally bundled data? This clears anything imported in this browser.")) onReset(); }}>
              Reset to bundled data
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [projects, setProjects] = useState(() => loadStoredProjects() || SEED_PROJECTS);

  const totals = useMemo(() => {
    const totalUnits = projects.reduce((s,p)=>s+num(p.totalUnits),0);
    const totalKho = projects.reduce((s,p)=>s+num(p.keyHandedOver),0);
    const totalMoved = projects.reduce((s,p)=>s+num(p.movedIn),0);
    const totalUnsold = projects.reduce((s,p)=>s+num(p.unsold),0);
    const activeDlp = projects.filter(p=>p.dlpStatusOwner==="ACTIVE").length;
    const endDlp = projects.filter(p=>p.dlpStatusOwner==="END").length;
    return { totalUnits, totalKho, totalMoved, totalUnsold, activeDlp, endDlp,
      khoPct: totalUnits ? (totalKho/totalUnits)*100 : 0,
      movedPct: totalUnits ? (totalMoved/totalUnits)*100 : 0,
      unsoldPct: totalUnits ? (totalUnsold/totalUnits)*100 : 0 };
  }, [projects]);

  const handleImport = (merged) => {
    setProjects(merged);
    saveStoredProjects(merged);
  };
  const handleReset = () => {
    localStorage.removeItem(STORAGE_KEY);
    setProjects(SEED_PROJECTS);
  };
  const handleExport = () => {
    const blob = new Blob([JSON.stringify(projects, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "pfmsb_project_dashboard_data.json";
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="app">
      <div className="header">
        <div style={{display:"flex", alignItems:"center", gap:16}}>
          <img src={LOGO_SRC} alt="PFMSB" style={{height:44, width:"auto", flexShrink:0}} />
          <div>
            <p className="eyebrow">PFMSB &middot; Portfolio Reporting</p>
            <h1>Project Information Dashboard</h1>
            <div className="sub">Status, typology &amp; handover progress across {projects.length} PR1MA / PPR projects</div>
          </div>
        </div>
        <div className="cutoff-badge">{fmt(totals.totalUnits)} total units in portfolio</div>
      </div>

      <UpdatePanel onImport={handleImport} onReset={handleReset} onExport={handleExport} />

      <div className="kpi-grid">
        <KpiCard label="Total Projects" value={projects.length}
          sub={totals.activeDlp + " active DLP · " + totals.endDlp + " DLP ended"} />
        <KpiCard label="Total Units" value={fmt(totals.totalUnits)}
          sub={projects.filter(p=>p.typology==="Landed").length + " landed · " + projects.filter(p=>p.typology==="High-Rise").length + " high-rise projects"} />
        <KpiCard label="Units Handed Over" value={pct1(totals.khoPct)}
          sub={fmt(totals.totalKho) + " of " + fmt(totals.totalUnits) + " units"} />
        <KpiCard label="Unsold Units" value={fmt(totals.totalUnsold)}
          sub={pct1(totals.unsoldPct) + " of total portfolio"} />
      </div>

      <div className="grid-2">
        <div className="panel">
          <h3>Units by State</h3>
          <div className="panel-sub">Total unit count per state across the portfolio</div>
          <StateChart projects={projects} />
        </div>
        <div className="panel">
          <h3>Top Unsold Projects</h3>
          <div className="panel-sub">Projects with the most unsold units</div>
          <UnsoldRiskList projects={projects} />
        </div>
      </div>

      <div className="grid-3">
        <div className="panel">
          <h3>Typology Mix</h3>
          <div className="panel-sub">Units by Landed vs High-Rise</div>
          <TypologyChart projects={projects} />
          <div style={{display:"flex", justifyContent:"center", gap:16, fontSize:12, marginTop:-6}}>
            <span><span className="legend-dot" style={{background:BLUE}}></span>Landed</span>
            <span><span className="legend-dot" style={{background:GOLD}}></span>High-Rise</span>
          </div>
        </div>
        <div className="panel">
          <h3>Management Status</h3>
          <div className="panel-sub">Projects by handover body</div>
          <ManagementChart projects={projects} />
        </div>
        <div className="panel">
          <h3>Handover Progress</h3>
          <div className="panel-sub">Portfolio-wide, cumulative</div>
          <div style={{display:"flex", justifyContent:"space-around"}}>
            <HandoverGauge label="Key Handed Over" pct={totals.khoPct} count={totals.totalKho} total={totals.totalUnits} color={GREEN} />
          </div>
          <div style={{display:"flex", justifyContent:"space-around", marginTop:-10}}>
            <HandoverGauge label="Moved In" pct={totals.movedPct} count={totals.totalMoved} total={totals.totalUnits} color={BLUE} />
          </div>
        </div>
      </div>

      <ProjectTable projects={projects} />

      <div className="footer-note">
        Source: PFMSB Operation Report 2026 — "PFMSB Master Project Data" merged with the latest monthly sales/handover sheet.<br/>
        Imported data is stored only in this browser (localStorage). Use "Export current dataset" to back it up or move it to another device.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
