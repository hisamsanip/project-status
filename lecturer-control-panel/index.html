<style>
  /* =====================================================================
   * DESIGN TOKENS  (diambil daripada rujukan UI: ungu-indigo + kad putih
   * + aksen merah jambu / biru muda, sudut besar, bayang lembut berlapis)
   * ===================================================================== */
  :root {
    --page:        #D9D3F1;      /* latar lavender luar */
    --violet:      #6E5CE7;      /* bingkai utama */
    --violet-deep: #5B4BD0;      /* panel dalam */
    --violet-ink:  #4A3BB8;
    --violet-soft: #EDE9FD;      /* butang sekunder pada kad putih */
    --violet-pale: #F5F3FD;      /* medan / kad kelabu-lavender */
    --sel:         #7B61E8;      /* "tarikh dipilih" */
    --pink:        #F28FD9;
    --pink-2:      #E87BCB;
    --blue:        #6CC4FA;
    --blue-2:      #55B3F3;
    --ink:         #1E1B4B;      /* teks pada kad putih */
    --ink-soft:    #6B6699;      /* 5.3:1 pada putih */
    --on-violet:   #fff;
    --on-violet-2: rgba(255,255,255,.86);
    --ok:          #2DD4A0;
    --warn:        #FFB547;
    --danger:      #F2603C;      /* amaran / masa kritikal (BUKAN rakaman) */
    --idle:        #B9B3DF;      /* tidak bersambung */
    --rec:         #FF3B5C;      /* merah dikhaskan untuk rakaman sahaja */

    /* Radius */
    --r-shell: 44px;
    --r-panel: 30px;
    --r-card:  24px;
    --r-btn:   18px;

    /* Bayang berlapis (lembut, ungu — bukan hitam) */
    --sh-shell: 0 60px 90px -40px rgba(80,55,200,.55), 0 28px 50px -24px rgba(60,40,160,.40);
    --sh-card:  0 18px 30px -12px rgba(38,20,125,.38), 0 4px 10px -2px rgba(38,20,125,.14);
    --sh-white: 0 14px 28px -12px rgba(60,40,150,.28), 0 2px 6px rgba(60,40,150,.08);
    --sh-btn:   0 12px 22px -8px rgba(80,55,215,.55);
    --sh-inset: inset 0 2px 6px rgba(80,60,170,.08);
  }
  * { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, 'Segoe UI', sans-serif; }
  html, body { min-height: 100%; }
  body {
    background: var(--page);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  button, .nosel { user-select: none; -webkit-user-select: none; }
  button { touch-action: manipulation; cursor: pointer; transition: transform .12s ease, background-color .18s ease, box-shadow .18s ease, opacity .18s ease, filter .18s ease; }
  button:active:not(:disabled) { transform: scale(.965); }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 3px solid #fff; outline-offset: 2px; box-shadow: 0 0 0 6px rgba(123,97,232,.55); }

  /* ---------- Bingkai ---------- */
  .page  { min-height: 100vh; padding: 11px; display: flex; }
  .shell {
    flex: 1; width: 100%; max-width: 1560px; margin: 0 auto;
    background: var(--violet); border-radius: var(--r-shell);
    box-shadow: var(--sh-shell);
    padding: 18px 24px 20px;
    display: flex; flex-direction: column; gap: 14px;
    color: var(--on-violet);
  }
  @media (max-width: 767px) { .page { padding: 8px; } .shell { padding: 16px; border-radius: 30px; } }

  h2.sec { font-size: 1.05rem; font-weight: 700; letter-spacing: .01em; }
  .muted { color: var(--on-violet-2); }

  /* ---------- Nav / sambungan ---------- */
  .nav { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 44px; height: 44px; }
  .brand h1 { line-height: 1; margin: 0; }
  .wm { height: 30px; width: auto; display: block; }
  .brand p  { font-size: .72rem; color: var(--on-violet-2); font-weight: 500; margin-top: 3px; letter-spacing: .01em; }

  .connect-pill {
    flex: 1 1 34rem; display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
    background: rgba(255,255,255,.13); border-radius: 26px; padding: 6px 6px 6px 10px;
  }
  .pfield { flex: 1 1 7rem; min-width: 0; padding: 4px 14px; border-radius: 18px; border-right: 0; position: relative; }
  .pfield + .pfield::before { content: ""; position: absolute; left: -2px; top: 12px; bottom: 12px; width: 1px; background: rgba(255,255,255,.2); }
  .pfield:focus-within { background: rgba(255,255,255,.12); }
  .pfield.host { flex: 2 1 9rem; } .pfield.port { flex: 0 1 6.5rem; }
  .pfield label.lbl { display: flex; align-items: center; justify-content: space-between; font-size: .66rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--on-violet-2); }
  .pfield input[type=text], .pfield input[type=number], .pfield input[type=password] {
    width: 100%; background: transparent; border: 0; outline: none; color: #fff; font-size: 1.05rem; font-weight: 600; height: 2rem; padding: 0;
  }
  .pfield input::placeholder { color: rgba(255,255,255,.62); font-weight: 500; }
  .pfield input:focus-visible { outline: none; box-shadow: none; }
  .remember { display: inline-flex; align-items: center; gap: 5px; font-size: .68rem; letter-spacing: 0; text-transform: none; font-weight: 600; }
  .remember input { width: 15px; height: 15px; accent-color: #fff; }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  #connectBtn {
    height: 3.25rem; min-width: 9.5rem; padding: 0 1.8rem; border-radius: 20px;
    background: #fff; color: var(--sel); font-weight: 800; font-size: 1.05rem; box-shadow: var(--sh-btn);
  }
  #connectBtn:hover:not(:disabled) { background: #F3F0FF; }
  #connBar[data-conn="connected"] #connectBtn { background: rgba(255,255,255,.2); color: #fff; box-shadow: none; }
  #connBar[data-conn="connecting"] #connectBtn { opacity: .7; }

  #statusPill {
    display: flex; align-items: center; gap: 10px; height: 3.25rem; padding: 0 1.2rem; min-width: 11.5rem;
    background: #fff; color: var(--ink); border-radius: 20px; box-shadow: var(--sh-white); font-weight: 800;
  }
  .status-dot { width: .8rem; height: .8rem; border-radius: 9999px; background: var(--idle); box-shadow: 0 0 0 4px rgba(185,179,223,.35); }
  [data-conn="connected"]  .status-dot { background: var(--ok); box-shadow: 0 0 0 4px rgba(45,212,160,.25); }
  [data-conn="connecting"] .status-dot { background: var(--warn); box-shadow: 0 0 0 4px rgba(255,181,71,.3); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.35); } }

  /* ---------- Susun atur utama ---------- */
  .main { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 1024px) { .main { grid-template-columns: minmax(0,1fr) 24rem; } }
  @media (min-width: 1536px) { .main { grid-template-columns: minmax(0,1fr) 27rem; } }
  .left { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  .panel { background: var(--violet-deep); border-radius: var(--r-panel); padding: 20px 22px; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
  .panel.scenes { flex: 1; display: flex; flex-direction: column; gap: 14px; }

  kbd { display: inline-grid; place-items: center; min-width: 1.6rem; height: 1.6rem; padding: 0 .35rem; border-radius: 8px; background: rgba(255,255,255,.16); font-size: .75rem; font-weight: 700; color: #fff; }

  .chip-btn {
    min-height: 2.9rem; padding: 0 1.1rem; border-radius: 16px; font-weight: 700; font-size: .95rem;
    background: rgba(255,255,255,.14); color: #fff;
  }
  .chip-btn:hover { background: rgba(255,255,255,.24); }
  summary { list-style: none; cursor: pointer; } summary::-webkit-details-marker { display: none; }

  /* ---------- Kad Scene ---------- */
  .scene-grid { flex: 1; display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 768px) { .scene-grid { grid-template-columns: repeat(3, minmax(0,1fr)); } }
  .scene-btn {
    --bg: #fff; --fg: var(--ink); --sub: var(--ink-soft); --key-bg: #E4F2FF; --key-fg: #2E9BEA;
    position: relative; overflow: hidden; text-align: left;
    background: var(--bg); color: var(--fg);
    border-radius: var(--r-card); padding: 1.1rem 1.25rem; min-height: 8.75rem;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: var(--sh-card);
  }
  .scene-btn[data-theme="pink"] { --bg: linear-gradient(150deg, var(--pink), var(--pink-2)); --fg: var(--ink); --sub: rgba(30,27,75,.78); --key-bg: rgba(255,255,255,.6); --key-fg: var(--ink); }
  .scene-btn[data-theme="blue"] { --bg: linear-gradient(150deg, var(--blue), var(--blue-2)); --fg: var(--ink); --sub: rgba(30,27,75,.78); --key-bg: rgba(255,255,255,.6); --key-fg: var(--ink); }
  .scene-btn::after { content: ""; position: absolute; right: -2.2rem; bottom: -2.8rem; width: 8rem; height: 8rem; border-radius: 9999px; background: rgba(255,255,255,.16); pointer-events: none; }
  .scene-btn[data-theme="white"]::after { background: #EEF6FF; }
  .scene-btn > * { position: relative; z-index: 1; }
  .scene-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .scene-btn[data-active="true"] {
    transform: translateY(-5px);
    box-shadow: 0 0 0 4px #fff, 0 0 0 9px rgba(255,255,255,.28), 0 26px 38px -14px rgba(30,15,110,.55);
  }
  .scene-btn[data-flash="true"] { filter: brightness(1.08); }
  .scene-btn:disabled { opacity: .55; filter: saturate(.7); }
  .scene-grid[data-has-active="true"] .scene-btn:not([data-active="true"]):not(:disabled) { opacity: .93; }
  .scene-key { width: 3rem; height: 3rem; border-radius: 9999px; display: grid; place-items: center; font-weight: 800; font-size: 1.4rem; background: var(--key-bg); color: var(--key-fg); }
  .scene-live { display: inline-flex; align-items: center; gap: 6px; opacity: 0; transform: scale(.85); transition: all .2s ease; background: var(--ink); color: #fff; font-size: .72rem; font-weight: 800; letter-spacing: .1em; padding: .35rem .75rem; border-radius: 9999px; }
  .scene-live i { width: .5rem; height: .5rem; border-radius: 9999px; background: var(--ok); }
  .scene-btn[data-active="true"] .scene-live { opacity: 1; transform: none; }
  .scene-title { font-size: 1.4rem; font-weight: 800; line-height: 1.15; }
  .scene-sub { margin-top: .25rem; font-size: .8rem; font-weight: 500; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scene-missing { display: none; margin-left: .4rem; padding: .1rem .5rem; border-radius: 8px; background: var(--ink); color: #FFD27A; font-weight: 800; font-size: .65rem; }
  .scene-btn[data-missing="true"] .scene-missing { display: inline-block; }

  /* ---------- Rakaman ---------- */
  .rec-row { display: flex; flex-wrap: wrap; align-items: stretch; gap: 16px 20px; }
  .rec-lamp {
    width: 4rem; height: 4rem; border-radius: 9999px; flex-shrink: 0;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), rgba(255,255,255,.12));
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.22);
  }
  .rec-lamp[data-on="true"] {
    background: radial-gradient(circle at 35% 30%, #ffb3c0, var(--rec) 45%, #C81E45);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.55), 0 0 0 7px rgba(255,59,92,.28), 0 0 38px 8px rgba(255,59,92,.7);
    animation: recPulse 1.2s ease-in-out infinite;
  }
  .rec-lamp[data-busy="true"] { background: radial-gradient(circle at 35% 30%, #fff0c2, var(--warn)); }
  @keyframes recPulse { 50% { box-shadow: inset 0 0 0 3px rgba(255,255,255,.55), 0 0 0 12px rgba(255,59,92,.08), 0 0 16px 2px rgba(255,59,92,.45); } }
  #recLabel { font-size: .85rem; font-weight: 800; letter-spacing: .1em; color: var(--on-violet-2); }
  #recLabel[data-on="true"] { color: #FFB3C4; }
  #recTime { font-size: 2.1rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; color: #fff; }
  #recTime[data-on="false"] { color: rgba(255,255,255,.85); }

  .rec-btn {
    flex: 1 1 14rem; min-height: 5.25rem; border-radius: 22px; font-size: 1.35rem; font-weight: 800; padding: 0 1.2rem;
    background: #fff; color: var(--sel); box-shadow: var(--sh-btn);
  }
  .rec-btn[data-state="idle"]:hover:not(:disabled) { background: #F3F0FF; }
  .rec-btn[data-state="recording"] { background: var(--rec); color: #fff; box-shadow: 0 14px 26px -10px rgba(255,59,92,.7); }
  .rec-btn[data-state="confirm"]   { background: var(--warn); color: var(--ink); animation: confirmBlink .6s ease-in-out infinite alternate; }
  .rec-btn[data-state="busy"]      { background: rgba(255,255,255,.2); color: #fff; box-shadow: none; }
  .rec-btn:disabled { background: rgba(255,255,255,.14) !important; color: rgba(255,255,255,.5) !important; box-shadow: none !important; animation: none; }
  @keyframes confirmBlink { to { filter: brightness(.9); } }

  /* ---------- Panel putih: Pemasa ---------- */
  .white-panel {
    background: #fff; color: var(--ink); border-radius: var(--r-panel); padding: 22px;
    display: flex; flex-direction: column; gap: 14px; box-shadow: var(--sh-white);
  }
  .date-btn { width: 3.25rem; height: 3.25rem; border-radius: 9999px; border: 2px solid #E7E3F7; display: grid; place-items: center; color: var(--ink); flex-shrink: 0; }
  .state-pill { font-size: .75rem; font-weight: 800; padding: .35rem .85rem; border-radius: 9px; background: var(--pink); color: var(--ink); }
  .state-pill[data-state="running"] { background: var(--blue-2); }
  .state-pill[data-state="paused"]  { background: var(--warn); }
  .state-pill[data-state="done"]    { background: var(--danger); color: #fff; animation: flash .8s steps(2) infinite; }

  .ring-wrap { position: relative; width: min(100%, 15.5rem); aspect-ratio: 1; margin: 2px auto; --ring: var(--sel); }
  .ring-wrap[data-level="warn"] { --ring: var(--warn); }
  .ring-wrap[data-level="crit"], .ring-wrap[data-level="done"] { --ring: var(--danger); }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .ring-track { fill: none; stroke: var(--violet-soft); stroke-width: 14; }
  .ring-prog  { fill: none; stroke: var(--ring); stroke-width: 14; stroke-linecap: round; stroke-dasharray: 691.15; stroke-dashoffset: 0; transition: stroke-dashoffset .3s linear, stroke .3s ease; filter: drop-shadow(0 6px 8px rgba(123,97,232,.35)); }
  .ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  #timerDisplay { font-size: 3.5rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; color: var(--ink); }
  #timerDisplay[data-level="warn"] { color: #B96A00; }
  #timerDisplay[data-level="crit"] { color: var(--danger); animation: flash 1s ease-in-out infinite; }
  #timerDisplay[data-level="done"] { color: var(--danger); animation: flash .6s steps(2) infinite; }
  @keyframes flash { 50% { opacity: .35; } }
  .ring-cap { font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); margin-top: .4rem; }

  .btn-main  { min-height: 3.75rem; border-radius: var(--r-btn); font-size: 1.15rem; font-weight: 800; color: #fff; background: var(--sel); box-shadow: var(--sh-btn); }
  .btn-main:hover { background: #6C50DD; }
  .btn-main[data-running="true"] { background: var(--warn); color: var(--ink); box-shadow: 0 12px 22px -8px rgba(255,181,71,.6); }
  .btn-soft  { min-height: 3.75rem; border-radius: var(--r-btn); font-size: 1rem; font-weight: 800; color: var(--sel); background: var(--violet-soft); }
  .btn-soft:hover { background: #E2DCFB; }

  .preset { height: 2.9rem; padding: 0; border-radius: 9999px; font-weight: 700; font-size: .95rem; color: var(--ink); background: transparent; }
  .preset:hover { background: var(--violet-soft); }
  .preset[data-on="true"] { background: var(--sel); color: #fff; box-shadow: 0 8px 16px -6px rgba(123,97,232,.7); }
  .lbl-dark { font-size: .7rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
  .field-light {
    height: 2.9rem; border-radius: 16px; background: var(--violet-pale); border: 2px solid transparent; box-shadow: var(--sh-inset);
    color: var(--ink); font-weight: 700; font-size: 1rem; padding: 0 .9rem; width: 100%;
  }
  .field-light:focus { border-color: var(--sel); outline: none; }

  /* ---------- Nota ---------- */
  .notes-card { flex: 1; min-height: 9.5rem; background: #fff; color: var(--ink); border-radius: var(--r-panel); padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--sh-white); }
  .notes-card textarea {
    flex: 1; min-height: 4.5rem; width: 100%; resize: none; background: var(--violet-pale); border: 2px solid transparent; border-radius: 20px;
    padding: 14px 18px; font-size: 1.15rem; line-height: 1.6; color: var(--ink); box-shadow: var(--sh-inset); font-weight: 500;
  }
  .notes-card textarea::placeholder { color: #7C77AD; }
  .notes-card textarea:focus { outline: none; border-color: var(--sel); background: #fff; }
  .chip-soft { min-height: 2.6rem; padding: 0 1rem; border-radius: 14px; font-weight: 700; font-size: .9rem; background: var(--violet-soft); color: var(--sel); }
  .chip-soft:hover { background: #E2DCFB; }

  /* ---------- Dropdown nama scene ---------- */
  .cfg-pop { position: absolute; right: 0; z-index: 30; margin-top: .6rem; width: min(92vw, 30rem); background: #fff; color: var(--ink); border-radius: 26px; padding: 18px; box-shadow: 0 30px 60px -20px rgba(40,20,130,.55), 0 6px 16px rgba(40,20,130,.18); display: flex; flex-direction: column; gap: 12px; }
  .cfg-pop .lbl-dark { display: block; margin-bottom: .3rem; }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 1.5rem; transform: translate(-50%, 140%); opacity: 0; pointer-events: none;
    max-width: min(92vw, 40rem); padding: 1rem 1.6rem; border-radius: 20px; text-align: center;
    background: #fff; color: var(--ink); font-weight: 700; font-size: 1rem; z-index: 50;
    box-shadow: 0 24px 40px -14px rgba(40,20,130,.5), 0 4px 10px rgba(40,20,130,.15);
    border-left: 6px solid var(--sel);
    transition: transform .25s ease, opacity .25s ease;
  }
  #toast.show { transform: translate(-50%, 0); opacity: 1; }
  #toast[data-kind="error"] { border-left-color: var(--danger); }
  #toast[data-kind="ok"] { border-left-color: var(--ok); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

<body class="antialiased">
<div class="page">
<div class="shell">

  <!-- ===================== 1. SAMBUNGAN OBS ===================== -->
  <header id="connBar" data-conn="disconnected" class="nav">
    <div class="brand">

.20-50.70 332.20-52.60Q337.20-55.80 343.90-55.80Q349.80-55.80 354.35-53.20Q358.90-50.60 361.50-45.95Q364.10-41.30 364.10-35.10L364.10 0L349.10 0L349.10-31.90Q349.10-35.10 347.95-37.40Q346.80-39.70 344.70-41Q342.60-42.30 339.60-42.30Q336.70-42.30 334.55-41Q332.40-39.70 331.25-37.40Q330.10-35.10 330.10-31.90L330.10 0L315.10 0L315.10-31.90Q315.10-35.10 313.95-37.40Q312.80-39.70 310.70-41Q308.60-42.30 305.60-42.30Q302.70-42.30 300.55-41Q298.40-39.70 297.25-37.40Q296.10-35.10 296.10-31.90" fill="#fff"/><circle cx="97.85" cy="-27.30" r="21.75" fill="none" stroke="#fff" stroke-width="15.00" stroke-linecap="round" pathLength="100" stroke-dasharray="76 24" transform="rotate(-90 97.85 -27.30)"/><circle cx="97.85" cy="-27.30" r="8.70" fill="#F28FD9"/></svg></h1>

<div id="toast" role="alert" data-kind="info"></div>

<script>
(() => {
  'use strict';
  const $  = (id) => document.getElementById(id);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));

  /* ---------- localStorage selamat (try/catch) ---------- */
  const store = {
    get(k, d = null) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
    set(k, v)        { try { localStorage.setItem(k, v); return true; } catch { return false; } },
    del(k)           { try { localStorage.removeItem(k); } catch {} },
  };
  const K = {
    host: 'ltcp.host', port: 'ltcp.port', pw: 'ltcp.password', remember: 'ltcp.rememberPw',
    scenes: 'ltcp.sceneNames', notes: 'ltcp.notes', timer: 'ltcp.timer',
  };

  /* ---------- Toast ---------- */
  let toastTimer;
  function toast(msg, kind = 'info', ms = 4000) {
    const t = $('toast');
    t.textContent = msg; t.dataset.kind = kind; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }

  const pad = (n) => String(n).padStart(2, '0');
  function fmtHMS(totalSec) {
    totalSec = Math.max(0, Math.floor(totalSec));
    const h = Math.floor(totalSec / 3600), m = Math.floor((totalSec % 3600) / 60), s = totalSec % 60;
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
  }

  /* ---------- Tarikh pada panel pemasa ---------- */
  function renderDate() {
    const d = new Date();
    try {
      $('dateDay').textContent  = d.toLocaleDateString('ms-MY', { weekday: 'long' });
      $('dateFull').textContent = d.toLocaleDateString('ms-MY', { day: 'numeric', month: 'long' });
    } catch {}
  }
  renderDate(); setInterval(renderDate, 60000);

  /* =====================================================================
   * 1. SAMBUNGAN OBS
   * ===================================================================== */
  if (typeof OBSWebSocket === 'undefined') {
    toast('obs-websocket-js gagal dimuat (semak sambungan internet / CDN).', 'error', 10000);
  }
  const obs = (typeof OBSWebSocket !== 'undefined') ? new OBSWebSocket() : null;

  let connected = false, connecting = false, intentionalClose = false;
  let sceneList = [];          // nama scene yang wujud dalam OBS
  let currentScene = null;     // scene program semasa

  $('host').value = store.get(K.host, 'localhost');
  $('port').value = store.get(K.port, '4455');
  $('rememberPw').checked = store.get(K.remember) === '1';
  if ($('rememberPw').checked) $('password').value = store.get(K.pw, '');

  function setConn(state) { // 'disconnected' | 'connecting' | 'connected'
    $('connBar').dataset.conn = state;
    $('statusText').textContent = { connected: 'Connected', connecting: 'Connecting…', disconnected: 'Disconnected' }[state];
    const btn = $('connectBtn');
    btn.textContent = { connected: 'Putuskan', connecting: 'Menyambung…', disconnected: 'Sambung' }[state];
    btn.disabled = state === 'connecting';
    ['host', 'port', 'password'].forEach(id => $(id).disabled = state !== 'disconnected');
    renderScenes(); renderRec();
  }

  function errText(e) {
    if (e && e.code === 4009) return 'Password OBS salah.';
    if (e && e.code === 4005) return 'OBS belum bersedia — cuba lagi sebentar.';
    return 'Tidak dapat sambung ke OBS. Pastikan OBS berjalan dan Tools → WebSocket Server Settings → Enable dihidupkan (port 4455).';
  }

  async function doConnect() {
    if (!obs || connected || connecting) return;
    const host = $('host').value.trim() || 'localhost';
    const port = parseInt($('port').value, 10) || 4455;
    const pw = $('password').value;
    store.set(K.host, host); store.set(K.port, String(port));
    store.set(K.remember, $('rememberPw').checked ? '1' : '0');
    if ($('rememberPw').checked) store.set(K.pw, pw); else store.del(K.pw);

    connecting = true; intentionalClose = false; setConn('connecting');
    try {
      await obs.connect(`ws://${host}:${port}`, pw || undefined);
      connected = true; connecting = false;
      setConn('connected');
      toast('Berjaya bersambung ke OBS', 'ok', 2000);
      await syncFromObs();
    } catch (e) {
      connected = false; connecting = false;
      setConn('disconnected');
      toast(errText(e), 'error', 7000);
    }
  }
  async function doDisconnect() {
    intentionalClose = true;
    try { await obs.disconnect(); } catch {}
  }
  $('connForm').addEventListener('submit', (e) => { e.preventDefault(); connected ? doDisconnect() : doConnect(); });

  if (obs) {
    obs.on('ConnectionClosed', () => {
      const wasConnected = connected;
      connected = false; connecting = false;
      currentScene = null; recState = { active: false, busy: false, paused: false };
      setConn('disconnected');
      if (wasConnected && !intentionalClose) toast('Sambungan ke OBS terputus.', 'error', 6000);
    });
    obs.on('CurrentProgramSceneChanged', (d) => { currentScene = d.sceneName; renderScenes(); });
    obs.on('SceneListChanged', () => refreshSceneList());
    obs.on('RecordStateChanged', onRecordStateChanged);
  }

  async function syncFromObs() {
    await refreshSceneList();
    try { currentScene = (await obs.call('GetCurrentProgramScene')).sceneName; } catch {}
    renderScenes();
    await refreshRecordStatus();
  }

  /* =====================================================================
   * 2. SCENE + PINTASAN KEKUNCI
   * ===================================================================== */
  const DEFAULT_SCENES = ['Slaid Kuliah', 'Demo Litar + Scope', 'Slaid + Kamera PiP'];
  let sceneNames = DEFAULT_SCENES.slice();
  try {
    const saved = JSON.parse(store.get(K.scenes, 'null'));
    if (Array.isArray(saved) && saved.length === 3) sceneNames = saved.map((s, i) => (typeof s === 'string' && s.trim()) ? s : DEFAULT_SCENES[i]);
  } catch {}

  const sceneBtns = $$('.scene-btn');
  const sceneInputs = [1, 2, 3].map(n => $('sceneName' + n));
  sceneInputs.forEach((inp, i) => {
    inp.value = sceneNames[i];
    inp.addEventListener('input', () => {
      sceneNames[i] = inp.value.trim() || DEFAULT_SCENES[i];
      store.set(K.scenes, JSON.stringify(sceneNames));
      renderScenes();
    });
  });
  $('sceneCfgClose').addEventListener('click', () => { $('sceneCfg').open = false; });

  async function refreshSceneList() {
    try {
      const r = await obs.call('GetSceneList');
      sceneList = r.scenes.map(s => s.sceneName);
      $('obsScenes').replaceChildren(...sceneList.map(n => { const o = document.createElement('option'); o.value = n; return o; }));
    } catch { sceneList = []; }
    renderScenes();
  }

  function renderScenes() {
    let anyActive = false;
    sceneBtns.forEach((btn, i) => {
      const name = sceneNames[i];
      btn.querySelector('.scene-name').textContent = '→ ' + name;
      btn.disabled = !connected;
      const active = connected && currentScene === name;
      anyActive = anyActive || active;
      btn.dataset.active = String(active);
      btn.dataset.missing = String(connected && sceneList.length > 0 && !sceneList.includes(name));
    });
    $('sceneGrid').dataset.hasActive = String(anyActive);
  }

  async function switchScene(i) {
    const btn = sceneBtns[i];
    btn.dataset.flash = 'true'; setTimeout(() => { btn.dataset.flash = 'false'; }, 180);
    if (!connected) { toast('Belum bersambung ke OBS — tekan "Sambung" dahulu.', 'error'); return; }
    const name = sceneNames[i];
    try {
      await obs.call('SetCurrentProgramScene', { sceneName: name });
      currentScene = name; renderScenes();           // event OBS akan mengesahkan
    } catch (e) {
      toast(`Gagal tukar ke scene "${name}". Semak nama scene dalam ⚙ Nama scene OBS.`, 'error', 6000);
    }
  }
  sceneBtns.forEach((btn, i) => btn.addEventListener('click', () => switchScene(i)));

  window.addEventListener('keydown', (e) => {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    const m = /^(?:Digit|Numpad)([1-3])$/.exec(e.code);
    if (m) { e.preventDefault(); switchScene(parseInt(m[1], 10) - 1); }
  });

  /* =====================================================================
   * 3. RAKAMAN
   * ===================================================================== */
  let recState = { active: false, busy: false, paused: false };
  let recBaseMs = 0, recSyncAt = 0;       // masa rakaman terkumpul + masa selaras
  let confirmStop = false, confirmTimer;

  async function refreshRecordStatus() {
    if (!connected) return;
    try {
      const s = await obs.call('GetRecordStatus');
      recState = { active: !!s.outputActive, busy: false, paused: !!s.outputPaused };
      recBaseMs = s.outputDuration || 0; recSyncAt = Date.now();
      renderRec();
    } catch {}
  }

  function onRecordStateChanged(d) {
    const st = d.outputState;
    if (st === 'OBS_WEBSOCKET_OUTPUT_STARTING')      recState = { active: false, busy: true, paused: false };
    else if (st === 'OBS_WEBSOCKET_OUTPUT_STARTED')  { recState = { active: true, busy: false, paused: false }; recBaseMs = 0; recSyncAt = Date.now(); $('recInfo').textContent = ''; }
    else if (st === 'OBS_WEBSOCKET_OUTPUT_STOPPING') recState = { active: true, busy: true, paused: false };
    else if (st === 'OBS_WEBSOCKET_OUTPUT_STOPPED')  {
      recState = { active: false, busy: false, paused: false };
      if (d.outputPath) { $('recInfo').textContent = 'Disimpan: ' + d.outputPath; $('recInfo').title = d.outputPath; toast('Rakaman dihentikan & disimpan', 'ok', 3500); }
    }
    else if (st === 'OBS_WEBSOCKET_OUTPUT_PAUSED')   { recBaseMs += Date.now() - recSyncAt; recState.paused = true; }
    else if (st === 'OBS_WEBSOCKET_OUTPUT_RESUMED')  { recState.paused = false; recSyncAt = Date.now(); }
    if (st !== 'OBS_WEBSOCKET_OUTPUT_STOPPING') cancelConfirm();
    renderRec();
  }

  function cancelConfirm() { confirmStop = false; clearTimeout(confirmTimer); }

  function renderRec() {
    const lamp = $('recLamp'), btn = $('recBtn');
    const lit = recState.active && !recState.busy && !recState.paused;
    lamp.dataset.on = String(lit);
    lamp.dataset.busy = String(recState.busy);
    let state, text, label;
    if (!connected)            { state = 'idle';      text = '● MULA RAKAMAN';  label = 'TIDAK MERAKAM'; }
    else if (recState.busy)    { state = 'busy';      text = 'Sila tunggu…';    label = recState.active ? 'MENGHENTI…' : 'MEMULAKAN…'; }
    else if (recState.active && confirmStop) { state = 'confirm'; text = '⚠ TEKAN LAGI UNTUK HENTI'; label = 'SEDANG MERAKAM'; }
    else if (recState.active)  { state = 'recording'; text = '■ HENTI RAKAMAN'; label = recState.paused ? 'DIJEDA' : 'SEDANG MERAKAM'; }
    else                       { state = 'idle';      text = '● MULA RAKAMAN';  label = 'TIDAK MERAKAM'; }
    btn.dataset.state = state; btn.textContent = text; btn.disabled = !connected || recState.busy;
    $('recLabel').textContent = label;
    $('recLabel').dataset.on = String(recState.active && !recState.paused);
    $('recTime').dataset.on = String(recState.active);
    renderRecTime();
  }
  function renderRecTime() {
    const ms = recState.active ? recBaseMs + (recState.paused ? 0 : Date.now() - recSyncAt) : 0;
    $('recTime').textContent = fmtHMS(ms / 1000);
  }
  setInterval(renderRecTime, 500);
  setInterval(() => { if (connected && recState.active) refreshRecordStatus(); }, 10000);   // selaras semula

  $('recBtn').addEventListener('click', async () => {
    if (!connected || recState.busy) return;
    try {
      if (!recState.active) {
        await obs.call('StartRecord');
      } else if (!confirmStop) {                      // Sentuh pertama: minta pengesahan (elak henti tak sengaja)
        confirmStop = true; renderRec();
        confirmTimer = setTimeout(() => { confirmStop = false; renderRec(); }, 3000);
      } else {
        cancelConfirm(); renderRec();
        await obs.call('StopRecord');
      }
    } catch (e) {
      cancelConfirm(); renderRec();
      toast('Operasi rakaman gagal: ' + (e && e.message ? e.message : 'ralat tidak diketahui'), 'error', 6000);
    }
  });

  /* =====================================================================
   * 4. PEMASA KULIAH
   * ===================================================================== */
  const RING_C = 2 * Math.PI * 110;
  const timer = { durationSec: 50 * 60, remainingMs: 50 * 60 * 1000, running: false, endAt: 0, finished: false };
  let audioCtx = null;

  function saveTimer() {
    store.set(K.timer, JSON.stringify({ d: timer.durationSec, r: timer.remainingMs, run: timer.running, end: timer.endAt, fin: timer.finished }));
  }
  (function restoreTimer() {
    try {
      const s = JSON.parse(store.get(K.timer, 'null'));
      if (!s || !(s.d > 0)) return;
      timer.durationSec = s.d; timer.remainingMs = s.r; timer.finished = !!s.fin;
      if (s.run && s.end) { timer.running = true; timer.endAt = s.end; }
    } catch {}
    $('timerMinutes').value = String(Math.round(timer.durationSec / 60));
  })();

  function beep(count = 3) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      for (let i = 0; i < count; i++) {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        const t0 = audioCtx.currentTime + i * 0.45;
        o.type = 'sine'; o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.4, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
        o.connect(g).connect(audioCtx.destination); o.start(t0); o.stop(t0 + 0.4);
      }
    } catch {}
  }

  function currentRemainingMs() { return timer.running ? Math.max(0, timer.endAt - Date.now()) : timer.remainingMs; }

  function renderTimer() {
    const ms = currentRemainingMs();
    const sec = Math.ceil(ms / 1000);
    const disp = $('timerDisplay');
    disp.textContent = sec >= 3600 ? fmtHMS(sec) : `${pad(Math.floor(sec / 60))}:${pad(sec % 60)}`;
    disp.style.fontSize = sec >= 3600 ? '2.6rem' : '';
    const started = ms < timer.durationSec * 1000;

    let level = 'ok';
    if (timer.finished) level = 'done'; else if (sec <= 60) level = 'crit'; else if (sec <= 300) level = 'warn';
    if (!timer.running && !timer.finished && !started) level = 'ok';
    disp.dataset.level = level; $('timerWrap').dataset.level = level;

    const progress = timer.finished ? 1 : Math.min(1, Math.max(0, ms / (timer.durationSec * 1000)));
    $('timerRing').style.strokeDashoffset = String(RING_C * (1 - progress));

    const st = timer.finished ? 'done' : timer.running ? 'running' : started ? 'paused' : 'ready';
    $('timerState').dataset.state = st;
    $('timerState').textContent = { done: 'Masa tamat!', running: 'Berjalan', paused: 'Dijeda', ready: 'Sedia' }[st];

    const tg = $('timerToggle');
    tg.textContent = timer.running ? '⏸ Jeda' : (started && !timer.finished ? '▶ Sambung' : '▶ Mula');
    tg.dataset.running = String(timer.running);

    const mins = Math.round(timer.durationSec / 60);
    $$('[data-preset]').forEach(b => { b.dataset.on = String(parseInt(b.dataset.preset, 10) === mins); });

    document.title = timer.running ? `${disp.textContent} · Podium` : 'Podium — Lecturer Teaching Control Panel';
  }

  function tickTimer() {
    if (timer.running && currentRemainingMs() <= 0) {
      timer.running = false; timer.remainingMs = 0; timer.finished = true; saveTimer();
      beep(3); toast('⏰ Masa kuliah tamat!', 'error', 8000);
    }
    renderTimer();
  }
  setInterval(tickTimer, 250);

  function setDuration(min) {
    min = Math.min(600, Math.max(1, Math.round(min) || 1));
    timer.durationSec = min * 60; timer.remainingMs = timer.durationSec * 1000;
    timer.running = false; timer.finished = false; $('timerMinutes').value = String(min);
    saveTimer(); renderTimer();
  }

  $('timerToggle').addEventListener('click', () => {
    audioCtx = audioCtx || (() => { try { return new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } })(); // buka audio melalui sentuhan pengguna
    if (timer.running) {
      timer.remainingMs = currentRemainingMs(); timer.running = false;
    } else {
      if (timer.finished || timer.remainingMs <= 0) { timer.remainingMs = timer.durationSec * 1000; timer.finished = false; }
      timer.endAt = Date.now() + timer.remainingMs; timer.running = true;
    }
    saveTimer(); renderTimer();
  });
  $('timerAdd').addEventListener('click', () => {
    const add = 5 * 60 * 1000;
    if (timer.running) timer.endAt += add; else timer.remainingMs = currentRemainingMs() + add;
    timer.durationSec = Math.max(timer.durationSec, Math.ceil((currentRemainingMs()) / 1000));
    timer.finished = false; saveTimer(); renderTimer();
  });
  $('timerReset').addEventListener('click', () => setDuration(timer.durationSec / 60));
  $$('[data-preset]').forEach(b => b.addEventListener('click', () => setDuration(parseInt(b.dataset.preset, 10))));
  $('timerMinutes').addEventListener('change', (e) => setDuration(parseFloat(e.target.value)));

  /* =====================================================================
   * 5. NOTA PANTAS (auto-simpan)
   * ===================================================================== */
  const notes = $('notes');
  notes.value = store.get(K.notes, '');
  let noteTimer;
  function saveNotes() {
    const ok = store.set(K.notes, notes.value);
    const t = new Date();
    $('noteStatus').textContent = ok ? `Disimpan ${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}` : 'Tidak dapat simpan (storan disekat)';
    $('noteStatus').style.color = ok ? '#17A57B' : '#E0305A';
  }
  notes.addEventListener('input', () => {
    $('noteStatus').textContent = 'Menyimpan…'; $('noteStatus').style.color = '';
    clearTimeout(noteTimer); noteTimer = setTimeout(saveNotes, 400);
  });
  window.addEventListener('beforeunload', () => { clearTimeout(noteTimer); store.set(K.notes, notes.value); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(noteTimer); store.set(K.notes, notes.value); } });
  $('noteClear').addEventListener('click', () => {
    if (!notes.value) return;
    if (confirm('Kosongkan semua nota?')) { notes.value = ''; saveNotes(); }
  });

  /* ---------- Mula ---------- */
  setConn('disconnected');
  renderTimer();
})();
</script>
</body>
</html>
