<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #071338; }
    </style>
  </head>
  <body>
    <!-- One film: intro (0–7.5s) then outro (7.5–14.5s). Remotion trims each part out of scenes.mp4. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="14.5" data-width="1920" data-height="1080">
      <div id="intro-host" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0" data-duration="7.5" data-track-index="0"></div>
      <div id="outro-host" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="7.5" data-duration="7" data-track-index="1"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
