<html data-composition-variables='[{"id": "subtitle", "type": "string", "label": "Subtitle", "default": "How to use it in 6 simple steps"}, {"id": "steps", "type": "string", "label": "Step chips, separated by |", "default": "Create|AI tool|Fill in|Role & tone|Style & file|Copy"}, {"id": "fadeAt", "type": "number", "label": "Fade-out start (seconds)", "default": 7.0}]'>
  <body>
    <style>
      /* Intro: Prompt Hub navy ground, powder blue and one yellow accent, Inter. Bottom 200px kept clear for Remotion subtitles. */
      :root {
        --ground: #131E3A;
        --ground-2: #1B2A4D;
        --ink: #ffffff;
        --muted: #AFC6E9;
        --sun: #FFC20D;
        --powder: #AFC6E9;
        --font: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      #intro-root {
        position: relative; width: 100%; height: 100%; font-family: var(--font); color: var(--ink);
        background:
          radial-gradient(1200px 700px at 50% 40%, var(--ground-2), transparent 70%),
          linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px) 0 0 / 60px 60px,
          linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px) 0 0 / 60px 60px,
          var(--ground);
      }
      .clip { position: absolute; inset: 0; }
      #logo {
        position: absolute; left: 50%; top: 150px; width: 250px; height: 250px; margin-left: -125px;
        border-radius: 56px; box-shadow: 0 30px 80px rgba(255,194,13,.28);
      }
      #logo img { width: 100%; height: 100%; border-radius: 56px; display: block; }
      #title {
        position: absolute; left: 0; right: 0; top: 440px; text-align: center;
        font-size: 128px; font-weight: 800; letter-spacing: -0.035em; line-height: 1;
      }
      #title span { color: var(--sun); }
      #by {
        position: absolute; left: 0; right: 0; top: 596px; text-align: center;
        font-size: 30px; font-weight: 600; letter-spacing: .04em; color: var(--powder);
      }
      #subtitle {
        position: absolute; left: 0; right: 0; top: 656px; text-align: center;
        font-size: 48px; font-weight: 500; color: var(--muted); letter-spacing: -0.01em;
      }
      #steps { position: absolute; left: 0; right: 0; top: 780px; display: flex; justify-content: center; gap: 18px; }
      .step {
        display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-radius: 999px;
        background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.18);
        font-size: 30px; font-weight: 600;
      }
      .step b {
        width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
        background: var(--sun); color: var(--ground); font-size: 22px; font-weight: 800;
      }
    </style>
    <div id="intro-root" data-composition-id="intro" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="scene" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <div id="logo"><img src="../assets/prompt-hub-mark.png" alt="Prompt Hub" /></div>
        <h1 id="title">Prompt <span>Hub</span></h1>
        <p id="by">by PFMSB</p>
        <p id="subtitle"></p>
        <div id="steps">
          <div class="step"><b>1</b><span></span></div>
          <div class="step"><b>2</b><span></span></div>
          <div class="step"><b>3</b><span></span></div>
          <div class="step"><b>4</b><span></span></div>
          <div class="step"><b>5</b><span></span></div>
          <div class="step"><b>6</b><span></span></div>
        </div>
      </div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      document.querySelector("#subtitle").textContent = v.subtitle;
      v.steps.split("|").forEach((t, i) => { document.querySelectorAll(".step span")[i].textContent = t; });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#logo", { opacity: 0, scale: 0.6, y: 40, filter: "blur(12px)" }, { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "back.out(1.6)" }, 0.1)
        .fromTo("#title", { opacity: 0, y: 60, scale: 1.08 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power4.out" }, 0.55)
        .fromTo("#by", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.85)
        .fromTo("#subtitle", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.95)
        .fromTo(".step", { opacity: 0, y: 40, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(2)", stagger: 0.14 }, 1.4)
        .to(".step b", { backgroundColor: "#AFC6E9", duration: 0.25, stagger: 0.14, yoyo: true, repeat: 1 }, 2.6)
        .to("#logo", { y: -14, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 2 }, 2.2)
        .to("#scene", { opacity: 0, scale: 1.06, filter: "blur(10px)", duration: 0.5, ease: "power2.in" }, v.fadeAt);
      window.__timelines["intro"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
