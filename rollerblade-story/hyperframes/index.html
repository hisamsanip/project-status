<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #2a2340; }
      #root { width: 1920px; height: 1080px; position: relative; }
    </style>
  </head>
  <body>
    <!-- Preview reel of the three overlay graphics used in the Remotion edit.
         Each one is rendered on its own with a transparent background (see render-overlays.sh). -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.5" data-width="1920" data-height="1080">
      <div id="intro-host" class="clip" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0" data-duration="3" data-track-index="0"></div>
      <div id="chapter-host" class="clip" data-composition-id="chapter" data-composition-src="compositions/chapter.html" data-start="3" data-duration="2.5" data-track-index="0"></div>
      <div id="outro-host" class="clip" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="5.5" data-duration="4" data-track-index="0"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
