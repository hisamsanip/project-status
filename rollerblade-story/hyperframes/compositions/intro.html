<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="./_base.css" />
    <style>
      #root { width: 1920px; height: 1080px; position: relative; }
      .wrap { position: absolute; left: 160px; top: 300px; }
      .kicker { font-size: 64px; color: var(--sky); rotate: -4deg; transform-origin: left center; margin-left: 8px; text-shadow: 0 4px 18px rgba(0,0,0,.45); }
      .t1, .t2 { font-size: 230px; color: var(--cream); text-shadow: 0 10px 40px rgba(0,0,0,.45); }
      .t2-box { position: relative; display: inline-block; margin-top: 6px; }
      .swipe { position: absolute; left: -24px; right: -24px; top: 22px; bottom: -14px; background: var(--pink); transform-origin: left center; z-index: 0; rotate: -1.5deg; }
      .t2 { position: relative; z-index: 1; color: var(--ink); text-shadow: none; padding: 0 6px; }
      .road { position: absolute; left: 160px; top: 905px; width: 1100px; height: 6px; background: var(--cream); border-radius: 3px; transform-origin: left center; opacity: .9; }
      .wheels { position: absolute; left: 160px; top: 860px; display: flex; gap: 14px; }
      .wheel { width: 36px; height: 36px; border-radius: 50%; background: var(--pink); border: 6px solid var(--cream); }
      .tag { position: absolute; left: 168px; top: 940px; font-size: 30px; color: var(--cream); opacity: .85; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="intro" data-start="0" data-duration="3" data-width="1920" data-height="1080">
      <div id="intro-stage" class="stage clip" data-start="0" data-duration="3" data-track-index="0">
        <div class="wrap">
          <div class="kicker marker" id="kicker">a rollerblade diary</div>
          <span class="line-mask"><div class="t1 anton" id="t1">Her first</div></span>
          <div class="t2-box">
            <div class="swipe" id="swipe"></div>
            <span class="line-mask"><div class="t2 anton" id="t2">Street ride</div></span>
          </div>
        </div>
        <div class="road" id="road"></div>
        <div class="wheels" id="wheels">
          <div class="wheel"></div><div class="wheel"></div><div class="wheel"></div><div class="wheel"></div>
        </div>
        <div class="tag label" id="tag">From wobble to wow</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#kicker", { opacity: 0, x: -40, rotation: -10 }, { opacity: 1, x: 0, rotation: -4, duration: 0.45, ease: "back.out(2)" }, 0.05);
      tl.fromTo("#t1", { y: 260 }, { y: 0, duration: 0.55, ease: "power4.out" }, 0.15);
      tl.fromTo("#swipe", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.inOut" }, 0.4);
      tl.fromTo("#t2", { y: 260 }, { y: 0, duration: 0.55, ease: "power4.out" }, 0.55);
      tl.fromTo("#road", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, 0.6);
      tl.fromTo("#wheels", { x: -220, opacity: 0 }, { x: 980, opacity: 1, duration: 1.5, ease: "power1.inOut" }, 0.7);
      tl.fromTo("#tag", { opacity: 0, y: 20 }, { opacity: 0.85, y: 0, duration: 0.4, ease: "power2.out" }, 0.75);
      // exit
      tl.to("#t1", { y: -260, duration: 0.4, ease: "power3.in" }, 2.45);
      tl.to("#t2", { y: -260, duration: 0.4, ease: "power3.in" }, 2.5);
      tl.to("#swipe", { scaleX: 0, duration: 0.3, ease: "power3.in" }, 2.6);
      tl.to(["#kicker", "#tag", "#road", "#wheels"], { opacity: 0, duration: 0.3 }, 2.6);
      window.__timelines = window.__timelines || {};
      window.__timelines["intro"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
