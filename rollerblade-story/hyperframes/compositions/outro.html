<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="./_base.css" />
    <style>
      #root { width: 1920px; height: 1080px; position: relative; }
      .burst { position: absolute; left: 1340px; top: 540px; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; border-radius: 50%; background: radial-gradient(circle, rgba(255,79,163,.85) 0%, rgba(255,79,163,.35) 45%, rgba(255,79,163,0) 70%); }
      .ring { position: absolute; left: 1340px; top: 540px; width: 620px; height: 620px; margin: -310px 0 0 -310px; border-radius: 50%; border: 10px solid var(--sky); }
      .stack { position: absolute; z-index: 2; right: 150px; top: 250px; text-align: right; }
      .w1 { font-size: 250px; color: var(--cream); text-shadow: 0 10px 40px rgba(0,0,0,.45); }
      .w2 { font-size: 250px; color: var(--pink); -webkit-text-stroke: 4px var(--cream); text-shadow: 0 10px 40px rgba(0,0,0,.35); }
      .note { position: absolute; z-index: 3; right: 160px; top: 800px; font-size: 52px; color: var(--sky); rotate: -3deg; text-shadow: 0 4px 18px rgba(0,0,0,.6); white-space: nowrap; }
      .sig { position: absolute; z-index: 3; right: 165px; top: 900px; font-size: 30px; color: var(--cream); opacity: .85; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="outro" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <div id="outro-stage" class="stage clip" data-start="0" data-duration="4" data-track-index="0">
        <div class="burst" id="burst"></div>
        <div class="ring" id="ring"></div>
        <div class="stack">
          <span class="line-mask"><div class="w1 anton" id="w1">Keep</div></span>
          <span class="line-mask"><div class="w2 anton" id="w2">Rolling</div></span>
        </div>
        <div class="note marker" id="note" data-layout-allow-occlusion>wobbly on day one. flying by the end.</div>
        <div class="sig label" id="sig">Episode 02 coming soon</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#burst", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "expo.out" }, 0);
      tl.fromTo("#ring", { scale: 0.3, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 1.1, ease: "power2.out" }, 0.05);
      tl.fromTo("#w1", { y: 280 }, { y: 0, duration: 0.55, ease: "power4.out" }, 0.15);
      tl.fromTo("#w2", { y: 280 }, { y: 0, duration: 0.55, ease: "power4.out" }, 0.3);
      tl.fromTo("#note", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: "back.out(1.8)" }, 0.9);
      tl.fromTo("#sig", { opacity: 0, y: 16 }, { opacity: 0.85, y: 0, duration: 0.4, ease: "power2.out" }, 1.3);
      window.__timelines = window.__timelines || {};
      window.__timelines["outro"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
